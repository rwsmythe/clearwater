[project]
name = "clearwater"
version = "1.0.0"
description = "Desktop tool that corrects color cast, contrast loss and haze in amateur underwater photos and video."
readme = "APPLICATION.md"
requires-python = ">=3.12,<3.13"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Robert Smythe" }]
# Product dependencies are added only by the work package whose brief allows it,
# and only after the architecture document names them (plan section 4.1, spec N13).
dependencies = [
    # WP3.1 (frame section 4 grant): the array backend (AD-1). SciPy kept on WP3.1's
    # measurement (docs/reports/wp3.1-array-backend.md, "SciPy versus own kernels").
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    # WP3.12 (CHARC ruling on the AD-5 STOP, 2026-10-20): the proxy cache stores JPEG proxies; already
    # the photo-I/O library of AD-17 (granted for the product). Moved from the dev group.
    # WP3.6 (frame section 4 grant; ruling 1): photo input. Moved from the dev group (X-B3).
    "pillow>=11,<13",
    "pillow-heif>=0.20,<2",
    # WP3.6 (CHARC ruling 1, AD-17/AD-18 amended; BSD-3): TIFF at every depth.
    "tifffile>=2025.1,<2027",
    # WP3.16 (frame section 4 grant): the GUI (D28, AD-18 LGPL-3); Essentials only (CHARC d06ed7c9).
    "pyside6-essentials>=6.12,<7",
]

[project.optional-dependencies]
# WP3.1 (frame section 4 grant, ruling 7): the GPU backend; CUDA files are never redistributed (AD-18).
# WP6.4 (AD-36): not on macOS, whose path is CPU only (no CUDA wheel exists for it).
gpu = ["cupy-cuda12x[ctk]>=14.2,<15; sys_platform != 'darwin'"]

[dependency-groups]
# The application toolchain (plan PD9).
dev = [
    "pytest>=8.3,<9",
    # WP-T4 (AD-28, CHARC grant; MIT): parallel test workers.
    "pytest-xdist>=3.6,<4",
    # WP-T7 (CHARC 97d5abbf; MIT, N13): per-test timeout on the gate legs (DR-109).
    "pytest-timeout>=2.3,<3",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "psutil>=6,<8",
    "py-cpuinfo>=9,<10",
    # WP1.2 Part A GPU candidate (CHARC grant; MIT). The product names it as the [gpu] extra (WP3.1);
    # kept here so the developer environment has CuPy (WP3.1 ruling 7); not on macOS: CPU only (AD-36).
    "cupy-cuda12x[ctk]>=14.2,<15; sys_platform != 'darwin'",
    # WP2.1S transport candidate (CHARC grant 5152ed4302874889). Spike and prototype only.
    "av>=15,<17",
    # WP3.16 ruling 3 (CHARC grant; MIT, AD-18): Qt test fixtures for the headless GUI tests.
    "pytest-qt>=4.5,<5",
    "pyinstaller>=6.22,<7",
]
# The harness's optional mail UI (scripts/comms_ui.py). The comms CORE
# (role_mail.py, the hooks, cell_depth.py) is stdlib-only and never imports it.
comms = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "comms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The harness suite under tests/harness runs under the stdlib unittest runner
# (python -m unittest discover -s tests/harness); keep it out of the product run.
norecursedirs = ["harness", ".worktrees", ".venv"]
pythonpath = ["tools"]
addopts = "--strict-markers"
timeout_method = "thread"
timeout_func_only = true
faulthandler_timeout = 300
markers = [
    "gpu: needs the graphics card",
    "footage: needs the owner's footage folder (skipped when the path is absent)",
    "gui: drives the PySide6 interface",
    "slow: takes more than a few seconds",
    "fullclip: the full-size form of a gate test sized by AD-30 (whole GX011627 or the pre-AD-30 frame count); excluded from both gate legs, run in package windows",
    "macos: a native macOS test (WP6.4 / WP6.5); skipped off darwin by an explicit platform skip (AD-36)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tools", "tests"]
# The harness core and its suite are upstream scaffold code, not product code.
# Markdown is prose; the fenced interface sketches in docs/ are not code ruff owns (CHARC, 2026-10-20).
extend-exclude = ["scripts", ".claude", "tests/harness", ".worktrees", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "ANN", "RUF", "SIM"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.12"
files = ["src/clearwater", "tools"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["psutil", "cpuinfo"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy"]
ignore_missing_imports = true
