name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without v; select its existing tag as the ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      UV_FROZEN: "1"
      UV_NO_SYNC: "1"
      UV_PYTHON_PREFERENCE: only-managed
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.10.9"
          python-version: "3.12.13"
          enable-cache: false
          checksum: f58dc40896000229db7c52b8bdd931394040ef2ad59abd1eda841f6d70b13d7a

      - name: Sync build environment
        run: |
          $started = Get-Date
          uv sync --frozen --no-default-groups --group dev --extra gpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Environment sync seconds: $(((Get-Date) - $started).TotalSeconds)"

      - name: Check release version
        id: version
        shell: uv run python {0}
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          import os
          import re
          import subprocess
          import clearwater

          ref = os.environ["GITHUB_REF"]
          if not re.fullmatch(r"refs/tags/v[0-9]+\.[0-9]+\.[0-9]+", ref):
              raise SystemExit("Release requires an existing vMAJOR.MINOR.PATCH tag")
          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True, timeout=30,
              ).stdout.strip()
          if git("cat-file", "-t", ref) != "tag":
              raise SystemExit("Release requires an ANNOTATED tag")
          if git("rev-parse", ref + "^{commit}") != os.environ["GITHUB_SHA"]:
              raise SystemExit("Annotated tag does not peel to the built commit")
          version = ref.removeprefix("refs/tags/v")
          if clearwater.__version__ != version:
              raise SystemExit("Tag version differs from clearwater.__version__")
          requested = os.environ.get("REQUESTED_VERSION", "")
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and requested != version:
              raise SystemExit("workflow_dispatch version differs from tag version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Verified release version {version}")

      - name: Run parallel tests
        run: |
          Remove-Item Env:PYTEST_ADDOPTS -ErrorAction SilentlyContinue
          uv run pytest -q -n 4 --timeout 600 -m "not gpu and not footage and not gui and not slow and not fullclip" --basetemp=work/ci-parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release folder and zip
        run: |
          $lock = Get-Content -LiteralPath tools/package/ffmpeg.lock.json -Raw | ConvertFrom-Json
          uv run python tools/package/build.py --form onedir --ffmpeg-from $lock.asset_url --ffmpeg-sha256 $lock.seat_sha256 --notices --smoke --zip --out work/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "Clearwater-$env:RELEASE_VERSION-windows-onedir"
          $files = @(
            "work/release/$name.zip",
            "work/release/$name.zip.sha256",
            "work/release/dist-onedir/$name/Clearwater/THIRD_PARTY_NOTICES.md"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release asset: $file"
            }
          }
          Add-Content -LiteralPath "work/release/$name.zip.sha256" -Value "# source-commit: $env:GITHUB_SHA" -Encoding ascii
          New-Item -ItemType Directory -Path "work/release-assets" | Out-Null
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file -Destination "work/release-assets"
          }

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: work/release-assets/*
          if-no-files-found: error

  release:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Refuse a published release
        shell: python {0}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          import json
          import os
          import subprocess

          checked = subprocess.run(
              ["gh", "release", "view", os.environ["TAG"], "--json", "isDraft"],
              capture_output=True, text=True, timeout=60, check=False,
          )
          if checked.returncode == 0:
              if json.loads(checked.stdout).get("isDraft") is not True:
                  raise SystemExit("Refusing to update an existing non-draft release")
          elif checked.stderr.strip() != "release not found":
              raise SystemExit("Cannot verify release state: " + checked.stderr.strip())

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: work/release-assets

      - name: Select release notes
        id: notes
        shell: python {0}
        env:
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          BUILT_COMMIT: ${{ github.sha }}
        run: |
          import os
          from pathlib import Path

          notes = Path("docs") / f"release-notes-{os.environ['RELEASE_VERSION']}.md"
          body = Path("work/release-body.md")
          body.parent.mkdir(parents=True, exist_ok=True)
          text = notes.read_text(encoding="utf-8") if notes.is_file() else ""
          body.write_text(text + f"\n\nSource commit: `{os.environ['BUILT_COMMIT']}`\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"body_path={body.as_posix()}\n")

      - name: Create draft release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          body_path: ${{ steps.notes.outputs.body_path }}
          fail_on_unmatched_files: true
          files: |
            work/release-assets/*.zip
            work/release-assets/*.zip.sha256
            work/release-assets/THIRD_PARTY_NOTICES.md
